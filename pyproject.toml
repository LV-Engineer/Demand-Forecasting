[project]
name = "demand-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.4",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand"]
